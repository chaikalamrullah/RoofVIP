<div class="news-list">
  {% for item in site.data.news %}
  <article class="news-item">
    <time>{{ item.date }}</time>
    <div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.body }}</p>
      {% if item.url %}<a class="text-link" href="{{ item.url | relative_url }}">Read more →</a>{% endif %}
    </div>
  </article>
  {% endfor %}
</div>
